# Fly.io settings for the API (the backend). Deploy from this folder:  fly deploy --ha=false
# The README ("Deploying: Vercel + Fly.io") has the whole list of commands.

app = "pulsewise"      # must be unique on Fly: if "fly apps create" says it is taken, pick another name and change it here
primary_region = "sin"     # Singapore: the closest region to the database (Mumbai) and to Pakistan. See: fly platform regions

[build]

[deploy]
  # Runs before every new version starts: brings the database up to date (it does nothing when it already is).
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  # ONE machine that never sleeps: the background jobs (usage count, reports, invoices) run inside the API.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"       # if the app is ever killed for memory: fly scale memory 1024
